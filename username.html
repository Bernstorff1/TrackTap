<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tapster · Choose username</title>
    <link rel="icon" type="image/png" href="assets/Tapsterlogonyt.png" />
    <link rel="stylesheet" href="styles.css?v=20" />
  </head>
  <body>
    <div class="bg-glow glow-one" aria-hidden="true"></div>
    <div class="bg-glow glow-two" aria-hidden="true"></div>
    <div class="bg-glow glow-three" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">
          <img class="brand-logo" src="assets/Tapsterlogonyt.png" alt="Tapster logo" />
        </div>
        <div>
          <div class="brand-name">Tapster</div>
          <div class="brand-sub">Choose username</div>
        </div>
      </div>
    </header>

    <main class="container username-page">
      <section class="card wide username-card">
        <h2>Choose your username</h2>
        <p class="playlist-meta">Required once. This name is shown in requests and scoreboards.</p>
        <form id="usernameForm" class="form">
          <label class="field">
            <span>Username *</span>
            <input id="usernameInput" type="text" maxlength="24" autocomplete="nickname" placeholder="e.g. AxelDJ" />
          </label>
          <div id="usernameHelper" class="helper visible">Use 2-24 characters.</div>
          <button id="usernameSave" class="btn primary" type="submit">Save username</button>
          <button id="usernameLogout" class="btn ghost small" type="button">Log out</button>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="username.js?v=3"></script>
  </body>
</html>
