<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aller — Musikønsker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-1" aria-hidden="true"></div>
    <div class="bg-orb orb-2" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" id="brandMark"><img src="public/icons/tracktap-icon.png" alt="TrackTap" /></div>
        <div>
          <div class="brand-name"><span id="brandNameText">Aller</span><input id="brandNameInput" class="brand-input is-hidden" type="text" value="Aller" aria-label="Rediger navn" /></div>
          <div class="brand-sub">Live musikønsker</div>
        </div>
      </div>
      <div class="role-toggle">
        <span>Gæst</span>
        <button id="brandEditToggle" class="brand-edit is-hidden" type="button">Rediger navn</button>
        <label class="switch">
          <input id="djMode" type="checkbox" />
          <span class="slider"></span>
        </label>
        <span>DJ</span>
      </div>
    </header>

    <main class="app">
      <section class="hero">
        <h1>Stem det næste nummer frem.</h1>
        <p>Ønsker rangeres live efter score. DJ kan markere afspillet.</p>
        <div class="room-chip">Room: <strong>Baren · Fredag</strong></div>
        <div class="payment-panel">
          <div class="payment-copy">
            <div class="payment-title">Køb ekstra stemmer</div>
            <div class="payment-count"><span id="creditCount">0</span> kreditter klar</div>
            <div class="payment-note">Sandbox · ingen rigtig betaling</div>
          </div>
          <div class="payment-buttons">
            <button class="pay-btn pay-apple" data-pay="apple">
              <span class="pay-icon"></span> Apple Pay <span class="pay-price">1 kr</span>
            </button>
            <button class="pay-btn pay-google" data-pay="google">
              <span class="pay-icon">G</span> Google Pay <span class="pay-price">1 kr</span>
            </button>
            <button class="pay-btn pay-mobile" data-pay="mobilepay">
              <span class="pay-icon">M</span> MobilePay <span class="pay-price">1 kr</span>
            </button>
          </div>
        </div>
      </section>

      <section class="tabs">
        <button class="tab active" data-tab="queued">
          Ønsker <span id="queuedCount" class="pill">0</span>
        </button>
        <button class="tab" data-tab="played">
          Afspillet <span id="playedCount" class="pill">0</span>
        </button>
      </section>

      <section class="lists">
        <div id="queuedList" class="list active" data-list="queued"></div>
        <div id="playedList" class="list" data-list="played"></div>
      </section>
    </main>

    <button id="addBtn" class="fab" aria-label="Tilføj ønske">+</button>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <div class="modal-header">
          <h2>Nyt musikønske</h2>
          <button id="closeModal" class="ghost">Luk</button>
        </div>
        <form id="requestForm">
          <label>
            Track title *
            <input id="trackTitle" type="text" required placeholder="Fx 'Superstition'" />
          </label>
          <div class="autocomplete">
            <div class="helper">Søg i Deezer og vælg track</div>
            <ul id="searchResults" class="search-results" aria-live="polite"></ul>
          </div>
          <label>
            Artist
            <input id="trackArtist" type="text" placeholder="Fx Stevie Wonder" />
          </label>
          <label>
            Kommentar
            <textarea id="trackComment" rows="3" placeholder="Valgfrit"></textarea>
          </label>
          <div class="actions">
            <button type="button" id="cancelBtn" class="ghost">Annuller</button>
            <button type="submit" class="primary">Send ønske</button>
          </div>
        </form>
      </div>
    </div>


    <div id="djModal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <div class="modal-header">
          <h2>DJ adgang</h2>
          <button id="closeDjModal" class="ghost">Luk</button>
        </div>
        <form id="djForm">
          <label>
            4-cifret kode
            <input id="djPin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required placeholder="••••" />
          </label>
          <div id="djError" class="form-error is-hidden">Forkert kode. Prøv igen.</div>
          <div class="actions">
            <button type="button" id="cancelDj" class="ghost">Annuller</button>
            <button type="submit" class="primary">Lås op</button>
          </div>
        </form>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
