<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tapster · My profile</title>
    <link rel="icon" type="image/png" href="assets/Tapsterlogonyt.png" />
    <link rel="stylesheet" href="styles.css?v=19" />
  </head>
  <body>
    <div class="bg-glow glow-one" aria-hidden="true"></div>
    <div class="bg-glow glow-two" aria-hidden="true"></div>
    <div class="bg-glow glow-three" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">
          <img class="brand-logo" src="assets/Tapsterlogonyt.png?v=3" alt="Tapster logo" />
        </div>
        <div>
          <div class="brand-name">Tapster</div>
          <div class="brand-sub">My profile</div>
        </div>
      </div>
      <div class="user-status">
        <button id="menuBtnProfile" class="btn ghost small" type="button">☰</button>
        <button id="userAvatarBtnProfile" class="avatar-btn is-hidden" type="button" aria-label="User">
          A
        </button>
        <div class="menu-panel is-hidden" id="userDropdownProfile">
          <button class="menu-item" type="button" data-action="create-playlist">Playlists</button>
          <button class="menu-item" type="button" data-action="profile">View profile</button>
          <button class="menu-item" type="button" data-action="scoreboard">Scoreboard</button>
          <button class="menu-item" type="button" data-action="rules">Vigtig info</button>
          <button class="menu-item danger" type="button" data-action="logout">Log out</button>
        </div>
      </div>
    </header>

    <main class="container profile-page">
      <section class="card wide">
        <h2>My account</h2>
        <p id="profileName" class="lead">Loading...</p>
        <div class="card">
          <div class="playlist-name">Credits</div>
          <div id="creditsTotal" class="code-value">0</div>
        </div>
        <div class="card received-card">
          <div class="playlist-name">Upvotes received</div>

          <div class="received-section">
            <div class="received-tag">Total</div>
            <div class="received-pill">Total</div>
          </div>
          <div class="received-grid">
            <div class="received-stat">
              <div class="received-label">
                <span class="stat-dot organic"></span>
                <span>Upvotes</span>
              </div>
              <div class="received-value" id="receivedTotalsAllOrganic">0</div>
              <div class="received-bar">
                <div class="received-bar-fill organic" id="receivedTotalsAllOrganicBar"></div>
              </div>
            </div>
            <div class="received-stat">
              <div class="received-label">
                <span class="stat-dot boost"></span>
                <span>Boosts</span>
              </div>
              <div class="received-value" id="receivedTotalsAllBoost">0</div>
              <div class="received-bar">
                <div class="received-bar-fill boost" id="receivedTotalsAllBoostBar"></div>
              </div>
            </div>
          </div>

          <div class="received-section">
            <div class="received-tag">Last 7 days</div>
            <div class="received-pill">Week</div>
          </div>
          <div class="received-grid">
            <div class="received-stat">
              <div class="received-label">
                <span class="stat-dot organic"></span>
                <span>Upvotes</span>
              </div>
              <div class="received-value" id="receivedTotalsWeekOrganic">0</div>
              <div class="received-bar">
                <div class="received-bar-fill organic" id="receivedTotalsWeekOrganicBar"></div>
              </div>
            </div>
            <div class="received-stat">
              <div class="received-label">
                <span class="stat-dot boost"></span>
                <span>Boosts</span>
              </div>
              <div class="received-value" id="receivedTotalsWeekBoost">0</div>
              <div class="received-bar">
                <div class="received-bar-fill boost" id="receivedTotalsWeekBoostBar"></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="card wide">
        <h2>My playlists</h2>
        <div id="profilePlaylists" class="playlist-list"></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="profile.js?v=37"></script>
  </body>
</html>
